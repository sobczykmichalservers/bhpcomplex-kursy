backend:
  name: github
  repo: sobczykmichalservers/bhpcomplex-kursy
  branch: main

media_folder: "img"
public_folder: "/img"

media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 1600
          height: 1600

collections:
  # ==========================================
  # WSPÓLNE MATERIAŁY SZKOLENIOWE (UDT)
  # ==========================================
  - name: "udt-materialy"
    label: "📚 UDT: Materiały szkoleniowe (Wspólne)"
    media_folder: "/img/udt-materialy/zdjecia"
    public_folder: "/img/udt-materialy/zdjecia"
    files:
      - name: "materialy"
        label: "Materiały szkoleniowe (wszystkie kursy UDT)"
        file: "data/udt_materialy.json"
        media_folder: "/img/udt-materialy/zdjecia"
        public_folder: "/img/udt-materialy/zdjecia"
        fields:
          - label: "Lista zagadnień (wyświetlana w każdym kursie UDT)"
            name: "items"
            widget: "list"
            summary: "Pytanie: {{fields.question}}"
            fields:
              - { label: "ID (opcjonalnie)", name: "id", widget: "number", required: false }
              - { label: "Pytanie / Zagadnienie", name: "question", widget: "string" }
              - { label: "Odpowiedź / Opis (formatowanie tekstu, zdjęcia, listy - jak w Wordzie)", name: "answer", widget: "markdown", required: false, media_folder: "/img/udt-materialy/zdjecia", public_folder: "/img/udt-materialy/zdjecia" }
              - { label: "Zdjęcie główne pod pytaniem (opcjonalnie)", name: "image", widget: "image", required: false, media_folder: "/img/udt-materialy/zdjecia", public_folder: "/img/udt-materialy/zdjecia" }
              - { label: "Plik PDF (opcjonalnie)", name: "file", widget: "file", required: false, media_folder: "/img/udt-materialy/pdf", public_folder: "/img/udt-materialy/pdf" }
              - { label: "Link do wideo / strony (opcjonalnie)", name: "link", widget: "string", required: false }

  # ==========================================
  # KURSY UDT (6 KATEGORII)
  # ==========================================
  - name: "wozki-podnosnikowe"
    label: "🚜 UDT: Wózki widłowe podnośnikowe"
    media_folder: "/img/wozki-podnosnikowe/zdjecia"
    public_folder: "/img/wozki-podnosnikowe/zdjecia"
    files:
      - name: "questions"
        label: "Pytania Egzaminacyjne"
        file: "data/wozki-podnosnikowe.json"
        media_folder: "/img/wozki-podnosnikowe/zdjecia"
        public_folder: "/img/wozki-podnosnikowe/zdjecia"
        fields:
          - label: "Lista pytań"
            name: "questions"
            widget: "list"
            summary: "Pytanie {{fields.id}}: {{fields.question}}"
            fields:
              - { label: "ID pytania (Numer)", name: "id", widget: "number" }
              - { label: "Treść pytania", name: "question", widget: "text" }
              - { label: "Zdjęcie (opcjonalnie)", name: "image", widget: "image", required: false, media_folder: "/img/wozki-podnosnikowe/zdjecia", public_folder: "/img/wozki-podnosnikowe/zdjecia" }
              - label: "Odpowiedzi (wpisz dokładnie 4: po kolei A, B, C, D)"
                name: "options"
                widget: "list"
                field: { label: "Odpowiedź", name: "option", widget: "string" }
              - { label: "Poprawna odpowiedź (1=A, 2=B, 3=C, 4=D)", name: "correct", widget: "number", min: 1, max: 4 }
      - name: "opisy"
        label: "Obsługa techniczna codzienna"
        file: "data/wozki-podnosnikowe_opisy.json"
        media_folder: "/img/wozki-podnosnikowe/zdjecia"
        public_folder: "/img/wozki-podnosnikowe/zdjecia"
        fields:
          - label: "Lista pytań (Obsługa techniczna codzienna)"
            name: "items"
            widget: "list"
            summary: "Pytanie: {{fields.question}}"
            fields:
              - { label: "ID (opcjonalnie)", name: "id", widget: "number", required: false }
              - { label: "Pytanie / Zagadnienie", name: "question", widget: "string" }
              - { label: "Odpowiedź / Opis (formatowanie tekstu, zdjęcia, listy - jak w Wordzie)", name: "answer", widget: "markdown", required: false, media_folder: "/img/wozki-podnosnikowe/zdjecia", public_folder: "/img/wozki-podnosnikowe/zdjecia" }
              - { label: "Zdjęcie (opcjonalnie)", name: "image", widget: "image", required: false, media_folder: "/img/wozki-podnosnikowe/zdjecia", public_folder: "/img/wozki-podnosnikowe/zdjecia" }
              - { label: "Plik PDF (opcjonalnie)", name: "file", widget: "file", required: false, media_folder: "/img/wozki-podnosnikowe/pdf", public_folder: "/img/wozki-podnosnikowe/pdf" }
              - { label: "Nagranie lektora (opcjonalnie) — dowolny format audio, automatycznie zmniejszane do lekkiego MP3", name: "audio", widget: "file", required: false, media_folder: "/img/wozki-podnosnikowe/audio", public_folder: "/img/wozki-podnosnikowe/audio" }
              - { label: "Link do wideo / strony (opcjonalnie)", name: "link", widget: "string", required: false }
      - name: "exam"
        label: "Ustawienia Egzaminu"
        file: "data/wozki-podnosnikowe_ustawienia.json"
        fields:
          - label: "Pule losowania pytań (Suma musi dawać 15)"
            name: "rules"
            widget: "list"
            fields:
              - { label: "Ile pytań wylosować z tego zakresu?", name: "count", widget: "number" }
              - { label: "Od pytania nr (ID)", name: "min", widget: "number" }
              - { label: "Do pytania nr (ID)", name: "max", widget: "number" }

