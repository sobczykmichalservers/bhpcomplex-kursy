<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel CMS — Szkolenia UDT & BHP</title>
    <!-- Link to config.yml -->
    <link href="config.yml" type="application/yaml" rel="cms-config-url" />
  </head>
  <body>
    <script>
      // Automatyczna konwersja każdego wgrywanego zdjęcia (PNG/JPG/JPEG/BMP) na lekki format WebP przed wysyłką
      (function () {
        const MAX_DIM = 1600;
        const QUALITY = 0.85;

        function isConvertibleImage(file) {
          if (!file || !file.type) return false;
          return /^image\/(png|jpe?g|bmp)$/i.test(file.type);
        }

        function convertFileToWebp(file) {
          return new Promise((resolve) => {
            const img = new Image();
            const objUrl = URL.createObjectURL(file);
            img.onload = () => {
              URL.revokeObjectURL(objUrl);
              let w = img.naturalWidth || img.width;
              let h = img.naturalHeight || img.height;
              if (w > MAX_DIM || h > MAX_DIM) {
                const ratio = Math.min(MAX_DIM / w, MAX_DIM / h);
                w = Math.round(w * ratio);
                h = Math.round(h * ratio);
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, w, h);
              canvas.toBlob(
                (blob) => {
                  if (!blob) {
                    resolve(file);
                    return;
                  }
                  const newName = file.name.replace(/\.(png|jpe?g|bmp)$/i, '') + '.webp';
                  const webpFile = new File([blob], newName, {
                    type: 'image/webp',
                    lastModified: Date.now(),
                  });
                  resolve(webpFile);
                },
                'image/webp',
                QUALITY
              );
            };
            img.onerror = () => {
              URL.revokeObjectURL(objUrl);
              resolve(file);
            };
            img.src = objUrl;
          });
        }

        document.addEventListener(
          'change',
          async (e) => {
            const input = e.target;
            if (!input || input.tagName !== 'INPUT' || input.type !== 'file' || input._webpDone) {
              return;
            }
            const files = Array.from(input.files || []);
            if (!files.some(isConvertibleImage)) return;

            e.stopImmediatePropagation();
            e.preventDefault();

            const dt = new DataTransfer();
            for (const f of files) {
              if (isConvertibleImage(f)) {
                const conv = await convertFileToWebp(f);
                dt.items.add(conv);
              } else {
                dt.items.add(f);
              }
            }
            input.files = dt.files;
            input._webpDone = true;
            input.dispatchEvent(new Event('change', { bubbles: true }));
            setTimeout(() => {
              input._webpDone = false;
            }, 200);
          },
          true
        );
      })();
    </script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  </body>
</html>
